<!doctype html>
<html lang="uk">
  <head>
    <!-- ═══ Tropa Club · index.html · ВЕРСІЯ i2 ═══ -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#50683c" />
    <meta name="application-name" content="Tropa Club" />
    <meta name="description" content="Tropa Club — одноденні поїздки в гори та міста Баварії. Твій шлях до нової подорожі." />

    <!-- Картка посилання в Telegram, WhatsApp, Viber: саме ці рядки
         показуються під посиланням, коли ним діляться. Раніше там брався
         заголовок сторінки зі старою назвою. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tropa Club" />
    <meta property="og:title" content="Tropa Club" />
    <meta property="og:description" content="Одноденні поїздки в гори та міста Баварії. Твій шлях до нової подорожі." />

    <!-- PWA: lets people add the app to their home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Ця назва стоїть під значком, коли застосунок додають на iPhone. -->
    <meta name="apple-mobile-web-app-title" content="Tropa Club" />
    <!-- Іконка для iPhone/iPad («На екран «Домів»» у Safari) -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Tropa Club · Поїздки Баварією</title>
    <style>
      html, body, #root { margin: 0; padding: 0; height: 100%; }
      body { -webkit-font-smoothing: antialiased; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
